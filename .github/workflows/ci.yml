name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main

permissions:
  contents: read

jobs:
  test:
    name: Run tests and upload reports
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env
        run: |
          printf '%s\n' '${{ secrets.ENV_TEST }}' > .env

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests + Packaging The Application
        run: ./mvnw clean package
        continue-on-error: true
        
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
          if-no-files-found: warn

  docker-publish:
    name: Build and push Docker image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/spring-petclinic:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/spring-petclinic:${{ github.sha }}
  
  deploy:
    name: Deploy via Ansible to Remote Server
    needs: docker-publish
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment: ansible
    env:
      SSH_USER: ubuntu
      ANSIBLE_HOST_KEY_CHECKING: 'False'
    permissions:
      id-token: write
      contents: read


    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: feat/infra-ansible
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name : List files 
        run: |
          echo "Listing files in the current directory:"
          ls -la

      - name: Configure AWS credentials (static keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify AWS identity (test login)
        run: |
          echo "Checking AWS caller identity..."
          aws sts get-caller-identity

      - name: Fail fast if not authenticated
        run: |
          if ! aws sts get-caller-identity > /dev/null 2>&1; then
            echo "AWS authentication failed"
            exit 1
          fi
          echo "AWS authentication succeeded"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Allow GitHub runner SSH access
        working-directory: terraform
        run: terraform apply 

      - name: Create SSH key from secret
        run: |
          mkdir -p "$HOME/.ssh"
          echo "Writing SSH key to $HOME/.ssh/petclinic.pem"
          printf "%s" "${{ secrets.DEPLOY_KEY }}" > "$HOME/.ssh/petclinic.pem"
          chmod 600 "$HOME/.ssh/petclinic.pem"
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

      - name: Test SSH connectivity
        run: |
          echo "Testing SSH to ${{ secrets.HOST_PUBLIC_IP }} as $SSH_USER"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -i "$HOME/.ssh/petclinic.pem" "$SSH_USER@${{ secrets.HOST_PUBLIC_IP }}" 'echo SSH_OK'
      
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-pip ssh
          python3 -m pip install --user ansible
          export PATH="$HOME/.local/bin:$PATH"

      - name: Ansible ad-hoc ping
        run: |
          echo "Running ansible ping against inventory in /opt/ansible"
          $HOME/.local/bin/ansible -i inventory/hosts.yml -m ping -u "$SSH_USER" --private-key "$HOME/.ssh/petclinic.pem"
      
      - name: Create .env from secret for deploy_app role
        run: |
          touch  roles/deploy_app/files/.env
          printf "%s" "${{ secrets.ENV_FILE }}" > roles/deploy_app/files/.env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Run Ansible playbook
        run: |
          echo "Running ansible-playbook site.yml from /opt/ansible"
          $HOME/.local/bin/ansible-playbook -i inventory/hosts.yml site.yml -u "$SSH_USER" --private-key "$HOME/.ssh/petclinic.pem"

      - name: Allow GitHub runner to destroy Terraform Role
        if: always()
        working-directory: terraform
        run: terraform destroy 