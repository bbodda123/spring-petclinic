  deploy:
    name: Deploy via Ansible to Remote Server
    # needs: docker-publish
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment: ansible
    env:
      SSH_USER: ubuntu
      ANSIBLE_HOST_KEY_CHECKING: 'False'
    permissions:
      id-token: write
      contents: read


    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: feat/infra-ansible
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        
      - name: Configure AWS credentials (static keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify AWS identity (test login)
        run: |
          echo "Checking AWS caller identity..."
          aws sts get-caller-identity

      - name: Fail fast if not authenticated
        run: |
          if ! aws sts get-caller-identity > /dev/null 2>&1; then
            echo "AWS authentication failed"
            exit 1
          fi
          echo "AWS authentication succeeded"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Allow GitHub runner SSH access
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Create SSH key from secret
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p $HOME/.ssh
          echo "Writing SSH key to $HOME/.ssh/petclinic.pem"
          printf '%s\n' "$SSH_PRIVATE_KEY" > $HOME/.ssh/petclinic.pem
          chmod 600 $HOME/.ssh/petclinic.pem

      - name: Validate SSH key
        run: |
          ssh-keygen -y -f "$HOME/.ssh/petclinic.pem" > /dev/null

      - name: Test SSH
        env:
          SSH_USER: ubuntu
          SSH_HOST: ${{ secrets.HOST_PUBLIC_IP }}
        run: |
          echo "Testing SSH to $SSH_HOST as $SSH_USER"

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/petclinic.pem" \
            "$SSH_USER@$SSH_HOST" \
            'echo SSH_OK'


      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-pip ssh
          python3 -m pip install --user ansible
          export PATH="$HOME/.local/bin:$PATH"

      - name: Ansible ad-hoc ping
        run: |
          echo "Running ansible ping against inventory in /opt/ansible"
          $HOME/.local/bin/ansible all -i inventory/hosts.yml -m ping
      
      - name: Create .env from secret for deploy_app role
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p roles/deploy_app/files
          printf '%s' "$ENV_FILE" > roles/deploy_app/files/.env

      - name: Run Ansible playbook
        run: |
          echo "Running ansible-playbook site.yml from /opt/ansible"
          $HOME/.local/bin/ansible-playbook -i inventory/hosts.yml site.yml

      - name: Allow GitHub runner to destroy Terraform Role
        if: always()
        working-directory: terraform
        run: terraform destroy -auto-approve