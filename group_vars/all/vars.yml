spring_app:
  app_version: "latest"
  spring_port: 8080
  domain: spring.abdelrahman-hassan.online
  admin_email: abdelrahmanhassanwork1@gmail.com
  # ansible_user and ansible_host are used to connect to the remote host. Update these values with your actual SSH username and the public IP address of your server.
  ansible_user: ubuntu
  ansible_host: 98.82.240.40
  # Hardening/runtime limits for the container
  run_uid: 1000
  run_gid: 1000
  mem_limit: "512m"
  cpus: "0.5"
  read_only: true
  # Bind address for host port mapping. Set to 0.0.0.0 to expose externally.
  bind_host: 127.0.0.1
  # If true, allow port 8080 in UFW to expose the app directly. Recommended: false if using nginx reverse proxy.
  expose_app_port: true
  tmp_writable_paths:
    - /tmp
    - /logs
  cap_drop:
    - NET_ADMIN
    - SYS_ADMIN
