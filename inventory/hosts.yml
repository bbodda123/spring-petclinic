all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
  children:
    spring_app:
      hosts:
        your-spring-host:
          # Replace with your host's public IP or DNS name
          ansible_host: "{{ spring_app.ansible_host }}"
          # SSH user for the host (e.g., ubuntu, ec2-user, deploy)
          ansible_user: "{{ spring_app.ansible_user }}"
          ansible_port: 22
          # Path to your SSH private key on the control machine
          ansible_ssh_private_key_file: ~/.ssh/petclinic.pem
          ansible_python_interpreter: /usr/bin/python3
          ansible_become: true

# Usage: update the above values (ansible_host, ansible_user, and key path)
# then run:
# ansible-playbook -i infrastructure/ansible/inventory/hosts.yml infrastructure/ansible/site.yml --ask-become-pass
