- name: Create app directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
    
- name: Create docker-compose.yml from template
  template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"

- name: Copy .env file to server
  ansible.builtin.copy:
    src: files/.env
    dest: "{{ app_dir }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Pull and run application via docker compose
  ansible.builtin.command:
    chdir: "{{ app_dir }}"
    cmd: docker compose up -d    

- name: Wait for application HTTP to respond
  wait_for:
    host: 127.0.0.1
    port: "{{ spring_app.spring_port }}"
    timeout: 60
