- name: Ensure UFW default deny incoming
  ufw:
    state: enabled
    policy: deny

- name: Allow SSH
  ufw:
    rule: allow
    name: OpenSSH

- name: Allow HTTP
  ufw:
    rule: allow
    port: 80

- name: Allow HTTPS
  ufw:
    rule: allow
    port: 443

- name: Allow application port (8080) when requested
  ufw:
    rule: allow
    port: "{{ spring_app.spring_port }}"
  when: spring_app.expose_app_port | default(false)
